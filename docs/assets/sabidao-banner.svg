    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#8fb8c8" stroke-opacity=".07"/>
    </pattern>
  </defs>
  <rect width="1200" height="340" rx="24" fill="url(#background)"/>
  <rect width="1200" height="340" rx="24" fill="url(#grid)"/>
