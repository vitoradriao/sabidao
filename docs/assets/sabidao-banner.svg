<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title description">
  <title id="title">Sabidão</title>
  <desc id="description">Suporte técnico com base na sua documentação. Fontes revisadas se tornam contexto e respostas no Discord e no Teams.</desc>
