    <text x="58" y="206" font-size="23" fill="#c7d8e7">Suporte técnico com base na sua documentação.</text>
    <text x="58" y="281" font-size="14" font-weight="600" letter-spacing="2" fill="#91b7c5">DISCORD / TEAMS / MAXPEDIDO</text>
