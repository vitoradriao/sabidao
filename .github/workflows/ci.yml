name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Validar dependências
        run: python -m pip check
      - name: Executar testes sem banco
        run: python -m unittest discover -s tests -p 'test_*.py'

  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: bot_maxima
          POSTGRES_USER: bot_maxima
          POSTGRES_PASSWORD: bot_maxima
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bot_maxima -d bot_maxima"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bot_maxima:bot_maxima@localhost:5432/bot_maxima
      RUN_DB_INTEGRATION_TESTS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Validar dependências
        run: python -m pip check
      - name: Instalar cliente PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Preparar banco de teste
        run: |
          for migration in \
            sql/setup_1536.sql \
            sql/migrate_hybrid_search.sql \
            sql/add_knowledge_gaps.sql \
            sql/add_feedback_memory.sql \
            sql/add_evaluation_tables.sql \
            sql/add_analytical_context.sql \
            sql/migrate_canonical_identity.sql \
            sql/migrate_priority.sql \
            sql/add_section_retrieval_1536.sql \
            sql/migrate_canonical_retrieval_1536.sql \
            sql/add_embedding_index_identity.sql \
            sql/add_ingest_identity.sql \
            sql/add_evaluation_identity.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Executar testes com banco real
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Validar contrato SQL da busca híbrida
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/postgres/hybrid_rrf_fixture.sql
      - name: Validar recuperação canônica
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/postgres/canonical_retrieval_fixture.sql
      - name: Validar identidade dos dados de avaliação
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/postgres/evaluation_identity_fixture.sql
